<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM // @iaconpatrick · Login</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a08;--bg2:#111110;--bg3:#1a1a18;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);--accent:#e8ff47;--text:#f0ede6;--text2:#888880;--text3:#444440;--success:#47ff8a;--accent2:#ff4757;--mono:'JetBrains Mono',monospace}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;display:flex;align-items:center;justify-content:center}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);pointer-events:none;z-index:9999}
.box{width:100%;max-width:360px;padding:20px}
.logo{text-align:center;margin-bottom:32px}
.logo-tag{font-size:10px;letter-spacing:.2em;color:var(--accent);font-weight:700}
.logo-name{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:8px 0 4px}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:.12em}
.card{background:var(--bg2);border:1px solid var(--border2);padding:28px}
.field{margin-bottom:16px}
.field-lbl{font-size:9px;letter-spacing:.16em;color:var(--text3);font-weight:700;margin-bottom:6px}
.field-inp{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:10px 13px;outline:none;transition:border-color .14s}
.field-inp:focus{border-color:var(--accent)}
.field-inp::placeholder{color:var(--text3)}
.btn{width:100%;background:var(--accent);color:#0a0a08;border:none;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;padding:12px;cursor:pointer;transition:opacity .15s;margin-top:8px}
.btn:hover{opacity:.85}.btn:disabled{opacity:.45;cursor:wait}
.err{font-size:11px;color:var(--accent2);margin-top:12px;text-align:center;display:none}
.err.show{display:block}
.dot{width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block;margin-right:5px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-tag">SYSTEM <span style="color:var(--text3)">// v2.0</span></div>
    <div class="logo-name">@iaconpatrick</div>
    <div class="logo-sub"><span class="dot"></span>DASHBOARD · ACCESO PRIVADO</div>
  </div>
  <div class="card">
    <div class="field">
      <div class="field-lbl">USUARIO</div>
      <input class="field-inp" id="user" type="text" placeholder="usuario" autocomplete="username">
    </div>
    <div class="field">
      <div class="field-lbl">CONTRASEÑA</div>
      <input class="field-inp" id="pass" type="password" placeholder="••••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="btn" onclick="login()">ENTRAR →</button>
    <div class="err" id="err">Usuario o contraseña incorrectos</div>
  </div>
</div>
<script>
document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('user').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('pass').focus(); });

async function login() {
  const user = document.getElementById('user').value.trim();
  const pass = document.getElementById('pass').value;
  const btn  = document.getElementById('btn');
  const err  = document.getElementById('err');
  if (!user || !pass) { err.textContent = 'Introduce usuario y contraseña'; err.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = 'VERIFICANDO...'; err.classList.remove('show');
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user, pass }) });
    if (r.ok) { window.location.href = '/'; }
    else { err.textContent = 'Usuario o contraseña incorrectos'; err.classList.add('show'); }
  } catch(e) { err.textContent = 'Error de conexión'; err.classList.add('show'); }
  finally { btn.disabled = false; btn.textContent = 'ENTRAR →'; }
}
</script>
</body>
</html>
